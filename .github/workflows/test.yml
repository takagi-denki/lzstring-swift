name: Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Do not let one failing OS hide the results from the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Swift (macOS / Linux)
      if: runner.os != 'Windows'
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.2'

    - name: Setup Swift (Windows)
      if: runner.os == 'Windows'
      uses: sushichop/gha-swift-env@v1
      with:
        swift-version: '6.2'

    # `swift test` also builds the benchmark target, and package-benchmark links jemalloc
    # only on macOS and Linux, so it is installed on those two and Windows needs nothing.
    - name: Install jemalloc (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjemalloc-dev

    - name: Install jemalloc (macOS)
      if: runner.os == 'macOS'
      run: brew install jemalloc

    # The tests read their fixtures through paths relative to the working directory, so
    # they must run from the package root.
    - name: Run tests
      if: runner.os != 'Linux'
      run: swift test

    - name: Run tests with coverage (Linux)
      if: runner.os == 'Linux'
      run: swift test --enable-code-coverage

    # Coverage is collected and uploaded from the Linux job only: the binary path and the
    # llvm-cov invocation are platform-specific.
    - name: Export coverage (Linux)
      if: runner.os == 'Linux'
      run: |
        BIN_PATH=$(swift build --show-bin-path)
        TEST_BINARY="$BIN_PATH/LZStringPackageTests.xctest"

        if [ ! -f "$TEST_BINARY" ]; then
          echo "Error: Test binary not found at $TEST_BINARY"
          exit 1
        fi

        echo "Found test binary: $TEST_BINARY"

        LLVM_COV="$(dirname "$(which swift)")/llvm-cov"
        PROFDATA="$BIN_PATH/codecov/default.profdata"

        "$LLVM_COV" export -format="lcov" "$TEST_BINARY" -instr-profile="$PROFDATA" > coverage.lcov

    - name: Upload coverage to Codecov (Linux)
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.lcov
        fail_ci_if_error: true
        verbose: true
