name: Test

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # 1 つの OS が落ちても他の結果を隠さない
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Swift (macOS / Linux)
      if: runner.os != 'Windows'
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.2'

    - name: Setup Swift (Windows)
      if: runner.os == 'Windows'
      uses: sushichop/gha-swift-env@v1
      with:
        swift-version: '6.2'

    # `swift test` はベンチマークターゲットもビルドする。package-benchmark は
    # jemalloc を macOS と Linux でのみリンクするため（Windows では不要）、
    # この 2 つの OS にだけ導入する。
    # `swift test` also builds the benchmark target. package-benchmark links
    # jemalloc only on macOS and Linux, so Windows needs nothing here.
    - name: Install jemalloc (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libjemalloc-dev

    - name: Install jemalloc (macOS)
      if: runner.os == 'macOS'
      run: brew install jemalloc

    # テストはフィクスチャをカレントディレクトリからの相対パスで読むため、
    # 必ずパッケージルートで実行する。
    - name: Run tests
      if: runner.os != 'Linux'
      run: swift test

    - name: Run tests with coverage (Linux)
      if: runner.os == 'Linux'
      run: swift test --enable-code-coverage

    # カバレッジの収集とアップロードは Linux の 1 ジョブだけで行う。
    # バイナリパスと llvm-cov の呼び出しはプラットフォーム依存のため。
    - name: Export coverage (Linux)
      if: runner.os == 'Linux'
      run: |
        BIN_PATH=$(swift build --show-bin-path)
        TEST_BINARY="$BIN_PATH/LZStringPackageTests.xctest"

        if [ ! -f "$TEST_BINARY" ]; then
          echo "Error: Test binary not found at $TEST_BINARY"
          exit 1
        fi

        echo "Found test binary: $TEST_BINARY"

        LLVM_COV="$(dirname "$(which swift)")/llvm-cov"
        PROFDATA="$BIN_PATH/codecov/default.profdata"

        "$LLVM_COV" export -format="lcov" "$TEST_BINARY" -instr-profile="$PROFDATA" > coverage.lcov

    - name: Upload coverage to Codecov (Linux)
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.lcov
        fail_ci_if_error: true
        verbose: true
