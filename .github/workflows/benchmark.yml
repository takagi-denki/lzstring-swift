name: Performance Benchmark

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Benchmarks/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev

      # Pin both sides to commit SHAs. A fork's branch name is not a branch of this
      # repository, so `git checkout <head_ref>` can select the wrong commit or fail
      # outright; if the fork uses `main`, it would compare this repository's main against
      # itself.
      #
      # Candidate = the PR head commit, the code as the author wrote it.
      # Baseline   = the PR base commit, a fixed point to merge into.
      - name: Fetch the PR head commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Create baseline from the PR base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          echo "baseline HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          swift package --allow-writing-to-package-directory benchmark baseline update ci-baseline

      # The baseline lives in an untracked directory; copy it aside so the next checkout
      # cannot remove it.
      - name: Preserve the baseline across the checkout
        run: cp -R .benchmarkBaselines "$RUNNER_TEMP/benchmark-baselines"

      - name: Check the PR head commit against the baseline
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          echo "candidate HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          rm -rf .benchmarkBaselines
          cp -R "$RUNNER_TEMP/benchmark-baselines" .benchmarkBaselines

          # package-benchmark's relative threshold is two-sided, so an improvement is also
          # reported as a deviation. The exit code cannot tell the two apart: the tool
          # defines .thresholdImprovement = 4, but that collapses to 1 at the
          # `swift package` plugin boundary. Only the output distinguishes them:
          #
          #   no deviation : exit 0, "is WITHIN the"
          #   improvement  : exit 1, "is BETTER than"
          #   regression   : exit 1, "is WORSE than"
          #
          # Regressions still fail and improvements pass, while any other non-zero exit
          # (a build failure, a missing baseline) keeps failing as before.
          set +e
          swift package --allow-writing-to-package-directory benchmark baseline check ci-baseline 2>&1 | tee "$RUNNER_TEMP/benchmark-check.log"
          check_status=${PIPESTATUS[0]}
          set -e

          if [ "$check_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "is WORSE than" "$RUNNER_TEMP/benchmark-check.log"; then
            echo "::error::Throughput regressed beyond the configured tolerance."
            exit 1
          fi

          if grep -q "is BETTER than" "$RUNNER_TEMP/benchmark-check.log"; then
            echo "::notice::Throughput improved beyond the tolerance. The two-sided threshold reports this as a deviation, but it is not a regression."
            exit 0
          fi

          echo "::error::The benchmark check failed for a reason other than a threshold deviation (exit $check_status)."
          exit 1