name: Performance Benchmark

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Benchmarks/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev

      # 比較対象は**コミット SHA で固定する**。ブランチ名では fork PR を正しく扱えない:
      # fork のブランチ名は base リポジトリのブランチとは限らず、fork 側が main を
      # 使っていると base の main 同士を比較してしまう。
      #
      # Pin both sides to commit SHAs. A fork's branch name is not a branch of this
      # repository, so `git checkout <head_ref>` can select the wrong commit (or fail).
      #
      # 候補 = PR の head コミット（作者が書いたコードそのもの）。
      # 基準 = PR の base コミット（マージ先の固定された地点）。
      # Candidate = the PR head commit; baseline = the PR base commit.
      - name: Fetch the PR head commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Create baseline from the PR base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          echo "baseline HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          swift package --allow-writing-to-package-directory benchmark baseline update ci-baseline

      # ベースラインは追跡対象外のディレクトリに書かれるため、
      # 次のチェックアウトで失われないよう退避する。
      # The baseline lives in an untracked directory; copy it aside so the next
      # checkout cannot remove it.
      - name: Preserve the baseline across the checkout
        run: cp -R .benchmarkBaselines "$RUNNER_TEMP/benchmark-baselines"

      - name: Check the PR head commit against the baseline
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout --detach "$HEAD_SHA"
          echo "candidate HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          rm -rf .benchmarkBaselines
          cp -R "$RUNNER_TEMP/benchmark-baselines" .benchmarkBaselines

          # package-benchmark の relative 閾値は両側判定なので、性能が改善したときも
          # 逸脱として報告される。終了コードでは区別できない（改善・劣化ともに 1 で、
          # ツールが定義する .thresholdImprovement = 4 は swift package プラグイン境界で
          # 潰れる）。区別できるのは出力だけ:
          #
          #   逸脱なし : exit 0, "is WITHIN the"
          #   改善のみ : exit 1, "is BETTER than"
          #   劣化あり : exit 1, "is WORSE than"
          #
          # 劣化は確実に落とし、改善は通す。それ以外の非ゼロ終了（ビルド失敗、
          # ベースライン未検出など）は従来どおり失敗させる。
          #
          # The relative threshold is two-sided, so an improvement is also reported as a
          # deviation and the exit code cannot tell the two apart. Only the output can.
          # Regressions still fail; improvements pass; any other non-zero exit still fails.
          set +e
          swift package --allow-writing-to-package-directory benchmark baseline check ci-baseline 2>&1 | tee "$RUNNER_TEMP/benchmark-check.log"
          check_status=${PIPESTATUS[0]}
          set -e

          if [ "$check_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "is WORSE than" "$RUNNER_TEMP/benchmark-check.log"; then
            echo "::error::Throughput regressed beyond the configured tolerance."
            exit 1
          fi

          if grep -q "is BETTER than" "$RUNNER_TEMP/benchmark-check.log"; then
            echo "::notice::Throughput improved beyond the tolerance. The two-sided threshold reports this as a deviation, but it is not a regression."
            exit 0
          fi

          echo "::error::The benchmark check failed for a reason other than a threshold deviation (exit $check_status)."
          exit 1