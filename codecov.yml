# Coverage scope and targets
#
# Measuring the test code itself defeats the purpose of coverage, which is how well the
# library is exercised. It also penalises diagnostic code that only runs on failure and
# hard-to-reach defensive branches: writing them would drop coverage and fail CI, which
# is pressure in the wrong direction (issue #51).

ignore:
  - "Tests/"
  - "Benchmarks/"
  - "Scripts/"
  # The test runner generated by SwiftPM; not repository code.
  - ".build/"

coverage:
  status:
    # With the exclusions above the baseline becomes the library-only figure. Track the
    # previous coverage rather than pinning a number, and allow a small drift.
    project:
      default:
        target: auto
        threshold: 1%
    # Patch coverage; a test-only PR has no measured lines and passes automatically.
    patch:
      default:
        target: 90%
        threshold: 0%

comment:
  layout: "reach, diff, files"
  require_changes: true
