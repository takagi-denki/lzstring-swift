# カバレッジの計測範囲と目標値 / Coverage scope and targets
#
# テストコード自身を計測対象に含めると、カバレッジ本来の目的
# （ライブラリ本体がどれだけ exercise されているか）が測れなくなる。
# 失敗時にしか実行されない診断コードや到達しにくい防御的分岐を
# テストに書いただけで CI が落ちるため、テストの質を下げる圧力になる (issue #51)。
#
# Measuring the test code itself defeats the purpose of coverage and penalises
# diagnostic or defensive code in tests, which is pressure in the wrong direction.

ignore:
  - "Tests/"
  - "Benchmarks/"
  - "Scripts/"
  # SwiftPM が生成するテストランナー。リポジトリのコードではない。
  # The test runner generated by SwiftPM; not repository code.
  - ".build/"

coverage:
  status:
    # 除外後の基準は Sources/ のみの数値になる。固定値ではなく直前の
    # カバレッジを基準にし、わずかな変動は許容する。
    # The baseline is now the library-only figure; track it rather than pinning a number.
    project:
      default:
        target: auto
        threshold: 1%
    # 変更行のカバレッジ。テスト専用の PR では対象行が無くなるため
    # Codecov 側で自動的に成功扱いになる。
    # Patch coverage; a test-only PR has no measured lines and passes automatically.
    patch:
      default:
        target: 90%
        threshold: 0%

comment:
  layout: "reach, diff, files"
  require_changes: true
